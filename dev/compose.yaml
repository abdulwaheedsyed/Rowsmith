# Throwaway databases for developing and testing Rowsmith.
#   docker compose -f dev/compose.yaml --env-file dev/.env up -d            # core (MySQL, MariaDB, PostGIS, ClickHouse, MongoDB, Redis, Valkey, CockroachDB, YugabyteDB, TiDB, Trino with Iceberg and Delta Lake, SSH bastion): what dev/smoke.py tests
#   docker compose -f dev/compose.yaml --env-file dev/.env --profile full up -d   # + MSSQL, Oracle, BigQuery emulator
# Nothing but Rowsmith is published, and only on 127.0.0.1.
name: rowsmith-dev

networks:
  dev: {}
  private:
    internal: true   # only the bastion can reach this network

volumes:
  rowsmith-data: {}

services:
  rowsmith:
    # The production image's base: CA certificates for cloud databases
    # (BigQuery, Snowflake) and AI providers, and nothing else.
    image: gcr.io/distroless/static-debian12:latest
    command: ["/app/rowsmith"]
    working_dir: /app
    volumes:
      - ../.bin:/app:ro
      - rowsmith-data:/data
    environment:
      ROWSMITH_DATA_DIR: /data
      ROWSMITH_INSECURE_COOKIES: "true"
      ROWSMITH_LOG_LEVEL: debug
    ports: ["127.0.0.1:18080:8080"]
    networks: [dev]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DEV_DB_PASSWORD}
      MYSQL_DATABASE: shop
    volumes: ["./seed/mysql.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro"]
    networks: [dev]
    healthcheck:   # over TCP, which only answers once first-run seeding is done
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -e 'SELECT 1 FROM shop.categories LIMIT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 100

  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: ${DEV_DB_PASSWORD}
      MARIADB_DATABASE: shop
    volumes: ["./seed/mysql.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro"]
    networks: [dev]
    healthcheck:   # over TCP, which only answers once first-run seeding is done
      test: ["CMD-SHELL", "mariadb -h127.0.0.1 -uroot -p\"$$MARIADB_ROOT_PASSWORD\" -e 'SELECT 1 FROM shop.categories LIMIT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 100

  postgis:
    image: postgis/postgis:latest
    environment:
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD}
      POSTGRES_DB: city
    volumes: ["./seed/postgis.sql:/docker-entrypoint-initdb.d/20-seed.sql:ro"]
    networks: [dev]
    healthcheck:   # over TCP, which only answers once first-run seeding is done
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U postgres -d city"]
      interval: 3s
      timeout: 5s
      retries: 100

  bastion:
    build: ./bastion
    environment:
      SSH_PASSWORD: ${DEV_SSH_PASSWORD}
      SSH_AUTHORIZED_KEY: ${DEV_SSH_PUBKEY:-}
    networks: [dev, private]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 22"]
      interval: 3s
      retries: 20

  private-pg:
    image: postgis/postgis:latest
    environment:
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD}
      POSTGRES_DB: vault
    networks: [private]
    healthcheck:   # over TCP, which only answers once first-run seeding is done
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U postgres -d vault"]
      interval: 3s
      timeout: 5s
      retries: 100

  clickhouse:
    image: clickhouse/clickhouse-server:26.9
    environment:
      CLICKHOUSE_PASSWORD: ${DEV_DB_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"   # the default user may manage users and grants
    volumes: ["./seed/clickhouse.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro"]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    networks: [dev]
    healthcheck:   # answers once first-run seeding is done
      test: ["CMD-SHELL", "clickhouse-client --password \"$$CLICKHOUSE_PASSWORD\" -q 'SELECT 1 FROM analytics.notes LIMIT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 100

  mssql:
    profiles: [full]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DEV_DB_PASSWORD}Aa1!
      MSSQL_PID: Developer
    networks: [dev]

  oracle:
    profiles: [full]
    image: gvenzl/oracle-free:23-faststart   # the regular image: the slim one leaves out Oracle Spatial
    environment:
      ORACLE_PASSWORD: ${DEV_DB_PASSWORD}
      APP_USER: shop
      APP_USER_PASSWORD: ${DEV_DB_PASSWORD}
    networks: [dev]

  mongo:
    image: mongo:8.3
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${DEV_DB_PASSWORD}
    volumes: ["./seed/mongo.js:/docker-entrypoint-initdb.d/10-seed.js:ro"]
    networks: [dev]
    healthcheck:   # over TCP, which only answers once first-run seeding is done
      test: ["CMD-SHELL", "mongosh --quiet --host \"$$(hostname -i)\" -u root -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --eval 'db.adminCommand({ping: 1}).ok' >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 100

  redis:
    image: redis:8.4
    environment:
      PW: ${DEV_DB_PASSWORD}
    # Loads the bundled JSON module, seeds once (dev/seed/redis.txt plus a
    # JSON document), then keeps the server in the foreground.
    command:
      - sh
      - -c
      - |
        redis-server --requirepass "$$PW" --loadmodule /usr/local/lib/redis/modules/rejson.so & pid=$$!
        trap 'kill $$pid; wait $$pid' TERM INT
        cli() { redis-cli -a "$$PW" --no-auth-warning "$$@"; }
        until cli ping >/dev/null 2>&1; do sleep 0.2; done
        [ "$$(cli EXISTS shop:name)" = 1 ] || cli < /seed/redis.txt >/dev/null
        [ "$$(cli EXISTS shop:settings)" = 1 ] || cli JSON.SET shop:settings '$$' '{"currency":"EUR","hours":{"open":"08:00","close":"18:00"},"tags":["coffee","bakery"]}' >/dev/null
        wait $$pid
    volumes: ["./seed/redis.txt:/seed/redis.txt:ro"]
    networks: [dev]
    healthcheck:   # answers once first-run seeding is done
      test: ["CMD-SHELL", "redis-cli -a \"$$PW\" --no-auth-warning -n 1 EXISTS cache:stats | grep -q 1"]
      interval: 3s
      timeout: 5s
      retries: 100

  valkey:
    image: valkey/valkey:9.0
    environment:
      PW: ${DEV_DB_PASSWORD}
    # Signs in as an ACL user (rowsmith), unlike the Redis service's default user.
    command:
      - sh
      - -c
      - |
        valkey-server --user default off --user rowsmith on ">$$PW" "~*" "&*" "+@all" & pid=$$!
        trap 'kill $$pid; wait $$pid' TERM INT
        cli() { valkey-cli --user rowsmith --pass "$$PW" --no-auth-warning "$$@"; }
        until cli ping >/dev/null 2>&1; do sleep 0.2; done
        [ "$$(cli EXISTS shop:name)" = 1 ] || cli < /seed/redis.txt >/dev/null
        wait $$pid
    volumes: ["./seed/redis.txt:/seed/redis.txt:ro"]
    networks: [dev]
    healthcheck:   # answers once first-run seeding is done
      test: ["CMD-SHELL", "valkey-cli --user rowsmith --pass \"$$PW\" --no-auth-warning -n 1 EXISTS cache:stats | grep -q 1"]
      interval: 3s
      timeout: 5s
      retries: 100

  cockroach:
    image: cockroachdb/cockroach:latest-v26.3
    # Secure mode with generated certificates; rowsmith signs in with a
    # password over TLS, as on CockroachDB Cloud.
    command: start-single-node
    environment:
      COCKROACH_DATABASE: shop
      COCKROACH_USER: rowsmith
      COCKROACH_PASSWORD: ${DEV_DB_PASSWORD}
    volumes: ["./seed/pgwire.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro"]
    networks: [dev]
    healthcheck:   # answers once first-run seeding is done
      test: ["CMD-SHELL", "cd /cockroach && cockroach sql --url=\"$$(cat server.url)\" -e 'SELECT 1 FROM shop.reporting.targets LIMIT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 10s
      retries: 100

  yugabyte:
    image: yugabytedb/yugabyte:2026.1.2.0-b137
    environment:
      PW: ${DEV_DB_PASSWORD}
    # One node with password sign-in (yugabyte / $$PW), seeded once.
    command:
      - sh
      - -c
      - |
        bin/yugabyted start --advertise_address="$$(hostname)" --tserver_flags=ysql_enable_auth=true --background=true >/dev/null
        ysql() { PGPASSWORD="$$1" bin/ysqlsh -h "$$(hostname)" -U yugabyte -v ON_ERROR_STOP=1 -q "$${@:2}"; }
        until ysql "$$PW" -c 'SELECT 1' >/dev/null 2>&1 || ysql yugabyte -c 'SELECT 1' >/dev/null 2>&1; do sleep 1; done
        if ysql yugabyte -c 'SELECT 1' >/dev/null 2>&1; then
          ysql yugabyte -c 'CREATE DATABASE shop' && ysql yugabyte -d shop -f /seed/pgwire.sql && ysql yugabyte -c "ALTER ROLE yugabyte PASSWORD '$$PW'"
        fi
        exec tail -f /dev/null
    volumes: ["./seed/pgwire.sql:/seed/pgwire.sql:ro"]
    networks: [dev]
    healthcheck:   # answers once first-run seeding is done
      test: ["CMD-SHELL", "PGPASSWORD=\"$$PW\" bin/ysqlsh -h \"$$(hostname)\" -U yugabyte -d shop -c 'SELECT 1 FROM reporting.targets LIMIT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 100

  tidb:
    image: pingcap/tidb:v8.5.5
    networks: [dev]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:10080/status >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 100

  # TiDB has no init scripts: this seeds it once, sets root's password,
  # and reports healthy when the data is there.
  tidb-seed:
    image: mysql:8.4
    depends_on:
      tidb: { condition: service_healthy }
    environment:
      PW: ${DEV_DB_PASSWORD}
    entrypoint:
      - sh
      - -c
      - |
        if mysql -h tidb -P 4000 -uroot -e 'SELECT 1' >/dev/null 2>&1; then
          mysql -h tidb -P 4000 -uroot < /seed/tidb.sql && mysql -h tidb -P 4000 -uroot -e "ALTER USER 'root'@'%' IDENTIFIED BY '$$PW'"
        fi
        exec sleep infinity
    volumes: ["./seed/tidb.sql:/seed/tidb.sql:ro"]
    networks: [dev]
    healthcheck:
      test: ["CMD-SHELL", "mysql -h tidb -P 4000 -uroot -p\"$$PW\" -e 'SELECT 1 FROM shop.categories LIMIT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 200

  # A small lake: SeaweedFS as S3, an Iceberg REST catalog, and Trino with
  # iceberg, delta, hive (plain Parquet/ORC/CSV files) and tpch catalogs.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    environment:
      PW: ${DEV_DB_PASSWORD}
    entrypoint:
      - sh
      - -c
      - |
        printf '{"identities":[{"name":"rowsmith","credentials":[{"accessKey":"rowsmith","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$PW" > /tmp/s3.json
        weed server -dir=/data -master.volumeSizeLimitMB=256 -s3 -s3.port=8333 -s3.config=/tmp/s3.json & pid=$$!
        trap 'kill $$pid; wait $$pid' TERM INT
        until echo "s3.bucket.list" | weed shell >/dev/null 2>&1; do sleep 1; done
        echo "s3.bucket.list" | weed shell 2>/dev/null | grep -q lake || echo "s3.bucket.create -name lake" | weed shell >/dev/null
        touch /tmp/ready
        wait $$pid
    networks: [dev]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 3s
      timeout: 5s
      retries: 100

  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1
    depends_on:
      seaweedfs: { condition: service_healthy }
    environment:
      CATALOG_WAREHOUSE: s3://lake/warehouse
      CATALOG_URI: jdbc:sqlite:file:/tmp/iceberg_catalog.db
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://seaweedfs:8333
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: rowsmith
      AWS_SECRET_ACCESS_KEY: ${DEV_DB_PASSWORD}
      AWS_REGION: us-east-1
    networks: [dev]

  trino:
    image: trinodb/trino:483
    depends_on:
      iceberg-rest: { condition: service_started }
    environment:
      LAKE_SECRET: ${DEV_DB_PASSWORD}
    volumes: ["./trino/catalog:/etc/trino/catalog:ro"]
    networks: [dev]
    healthcheck:
      test: ["CMD-SHELL", "trino --execute 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 60

  # Seeds the lake once (dev/seed/trino.sql) and reports healthy when done.
  trino-seed:
    image: trinodb/trino:483
    depends_on:
      trino: { condition: service_healthy }
    entrypoint:
      - sh
      - -c
      - |
        t() { trino --server http://trino:8080 --user rowsmith "$$@"; }
        if [ -z "$$(t --execute "SHOW SCHEMAS FROM iceberg LIKE 'shop'" 2>/dev/null)" ]; then
          t -f /seed/trino.sql
        fi
        if [ -z "$$(t --execute "SHOW SCHEMAS FROM delta LIKE 'sales'" 2>/dev/null)" ]; then
          t -f /seed/trino-delta.sql
        fi
        exec sleep infinity
    volumes: ["./seed/trino.sql:/seed/trino.sql:ro", "./seed/trino-delta.sql:/seed/trino-delta.sql:ro"]
    networks: [dev]
    healthcheck:
      test: ["CMD-SHELL", "trino --server http://trino:8080 --execute 'SELECT 1 FROM hive.raw.nations CROSS JOIN delta.sales.payments LIMIT 1' 2>/dev/null | grep -q 1"]
      interval: 5s
      timeout: 20s
      retries: 120

  bigquery:
    profiles: [full]
    image: ghcr.io/goccy/bigquery-emulator:latest
    command: ["--project=rowsmith-dev", "--dataset=analytics"]
    networks: [dev]
