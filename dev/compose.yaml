# Throwaway databases for developing and testing Rowsmith.
#   docker compose -f dev/compose.yaml --env-file dev/.env up -d            # core (MySQL, MariaDB, PostGIS, ClickHouse, MongoDB, Redis, Redis Cluster, Valkey, Cassandra, ScyllaDB, Elasticsearch, OpenSearch, CockroachDB, YugabyteDB, TiDB, Trino with Iceberg and Delta Lake, SSH bastion): what dev/smoke.py tests
#   docker compose -f dev/compose.yaml --env-file dev/.env --profile full up -d   # + MSSQL, Oracle, BigQuery emulator
# Nothing but Rowsmith is published, and only on 127.0.0.1.
name: rowsmith-dev

networks:
  dev: {}
  private:
    internal: true   # only the bastion can reach this network

volumes:
  rowsmith-data: {}

services:
  rowsmith:
    # The production image's base: CA certificates for cloud databases
    # (BigQuery, Snowflake) and AI providers, and nothing else.
    image: gcr.io/distroless/static-debian12:latest
    command: ["/app/rowsmith"]
    working_dir: /app
    volumes:
      - ../.bin:/app:ro
      - rowsmith-data:/data
    environment:
      ROWSMITH_DATA_DIR: /data
      ROWSMITH_INSECURE_COOKIES: "true"
      ROWSMITH_LOG_LEVEL: debug
    ports: ["127.0.0.1:18080:8080"]
    networks: [dev]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DEV_DB_PASSWORD}
      MYSQL_DATABASE: shop
    volumes: ["./seed/mysql.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro"]
    networks: [dev]
    healthcheck:   # over TCP, which only answers once first-run seeding is done
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -e 'SELECT 1 FROM shop.categories LIMIT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 100

  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: ${DEV_DB_PASSWORD}
      MARIADB_DATABASE: shop
    volumes: ["./seed/mysql.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro"]
    networks: [dev]
    healthcheck:   # over TCP, which only answers once first-run seeding is done
      test: ["CMD-SHELL", "mariadb -h127.0.0.1 -uroot -p\"$$MARIADB_ROOT_PASSWORD\" -e 'SELECT 1 FROM shop.categories LIMIT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 100

  postgis:
    image: postgis/postgis:latest
    environment:
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD}
      POSTGRES_DB: city
    volumes: ["./seed/postgis.sql:/docker-entrypoint-initdb.d/20-seed.sql:ro"]
    networks: [dev]
    healthcheck:   # over TCP, which only answers once first-run seeding is done
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U postgres -d city"]
      interval: 3s
      timeout: 5s
      retries: 100

  bastion:
    build: ./bastion
    environment:
      SSH_PASSWORD: ${DEV_SSH_PASSWORD}
      SSH_AUTHORIZED_KEY: ${DEV_SSH_PUBKEY:-}
    networks: [dev, private]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 22"]
      interval: 3s
      retries: 20

  private-pg:
    image: postgis/postgis:latest
    environment:
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD}
      POSTGRES_DB: vault
    networks: [private]
    healthcheck:   # over TCP, which only answers once first-run seeding is done
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U postgres -d vault"]
      interval: 3s
      timeout: 5s
      retries: 100

  clickhouse:
    image: clickhouse/clickhouse-server:26.9
    environment:
      CLICKHOUSE_PASSWORD: ${DEV_DB_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"   # the default user may manage users and grants
    volumes: ["./seed/clickhouse.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro"]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    networks: [dev]
    healthcheck:   # answers once first-run seeding is done
      test: ["CMD-SHELL", "clickhouse-client --password \"$$CLICKHOUSE_PASSWORD\" -q 'SELECT 1 FROM analytics.notes LIMIT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 100

  mssql:
    profiles: [full]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DEV_DB_PASSWORD}Aa1!
      MSSQL_PID: Developer
    networks: [dev]

  oracle:
    profiles: [full]
    image: gvenzl/oracle-free:23-faststart   # the regular image: the slim one leaves out Oracle Spatial
    environment:
      ORACLE_PASSWORD: ${DEV_DB_PASSWORD}
      APP_USER: shop
      APP_USER_PASSWORD: ${DEV_DB_PASSWORD}
    networks: [dev]

  mongo:
    image: mongo:8.3
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${DEV_DB_PASSWORD}
    volumes: ["./seed/mongo.js:/docker-entrypoint-initdb.d/10-seed.js:ro"]
    networks: [dev]
    healthcheck:   # over TCP, which only answers once first-run seeding is done
      test: ["CMD-SHELL", "mongosh --quiet --host \"$$(hostname -i)\" -u root -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --eval 'db.adminCommand({ping: 1}).ok' >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 100

  redis:
    image: redis:8.4
    environment:
      PW: ${DEV_DB_PASSWORD}
    # Loads the bundled JSON module, seeds once (dev/seed/redis.txt plus a
    # JSON document), then keeps the server in the foreground.
    command:
      - sh
      - -c
      - |
        redis-server --requirepass "$$PW" --loadmodule /usr/local/lib/redis/modules/rejson.so & pid=$$!
        trap 'kill $$pid; wait $$pid' TERM INT
        cli() { redis-cli -a "$$PW" --no-auth-warning "$$@"; }
        until cli ping >/dev/null 2>&1; do sleep 0.2; done
        [ "$$(cli EXISTS shop:name)" = 1 ] || cli < /seed/redis.txt >/dev/null
        [ "$$(cli EXISTS shop:settings)" = 1 ] || cli JSON.SET shop:settings '$$' '{"currency":"EUR","hours":{"open":"08:00","close":"18:00"},"tags":["coffee","bakery"]}' >/dev/null
        wait $$pid
    volumes: ["./seed/redis.txt:/seed/redis.txt:ro"]
    networks: [dev]
    healthcheck:   # answers once first-run seeding is done
      test: ["CMD-SHELL", "redis-cli -a \"$$PW\" --no-auth-warning -n 1 EXISTS cache:stats | grep -q 1"]
      interval: 3s
      timeout: 5s
      retries: 100

  # A Redis Cluster of three primaries (ports 7001-7003) in one container,
  # announcing the host name redis-cluster so clients follow its redirects.
  redis-cluster:
    image: redis:8.4
    environment:
      PW: ${DEV_DB_PASSWORD}
    command:
      - sh
      - -c
      - |
        cli() { redis-cli -a "$$PW" --no-auth-warning "$$@"; }
        for p in 7001 7002 7003; do
          mkdir -p /data/$$p
          redis-server --port $$p --dir /data/$$p --cluster-enabled yes --cluster-config-file nodes.conf --requirepass "$$PW" --masterauth "$$PW" \
            --cluster-announce-hostname redis-cluster --cluster-preferred-endpoint-type hostname --save "" --appendonly no --daemonize yes
        done
        for p in 7001 7002 7003; do until cli -p $$p ping >/dev/null 2>&1; do sleep 0.2; done; done
        cli -p 7001 cluster info | grep -q cluster_state:ok || cli --cluster create 127.0.0.1:7001 127.0.0.1:7002 127.0.0.1:7003 --cluster-replicas 0 --cluster-yes >/dev/null
        # Every node must know the slots before writes land; repeat the seed
        # (it only sets keys) until all 23 keys exist across the nodes.
        for p in 7001 7002 7003; do until cli -p $$p cluster info | grep -q cluster_state:ok; do sleep 0.5; done; done
        keys() { n=0; for p in 7001 7002 7003; do n=$$((n + $$(cli -p $$p dbsize))); done; echo $$n; }
        until [ "$$(keys)" -ge 23 ]; do cli -c -p 7001 < /seed/redis-cluster.txt >/dev/null 2>&1; sleep 1; done
        touch /tmp/ready
        trap 'for p in 7001 7002 7003; do cli -p $$p shutdown nosave; done; exit 0' TERM INT
        sleep infinity & wait
    volumes: ["./seed/redis-cluster.txt:/seed/redis-cluster.txt:ro"]
    networks: [dev]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 3s
      timeout: 5s
      retries: 100

  valkey:
    image: valkey/valkey:9.0
    environment:
      PW: ${DEV_DB_PASSWORD}
    # Signs in as an ACL user (rowsmith), unlike the Redis service's default user.
    command:
      - sh
      - -c
      - |
        valkey-server --user default off --user rowsmith on ">$$PW" "~*" "&*" "+@all" & pid=$$!
        trap 'kill $$pid; wait $$pid' TERM INT
        cli() { valkey-cli --user rowsmith --pass "$$PW" --no-auth-warning "$$@"; }
        until cli ping >/dev/null 2>&1; do sleep 0.2; done
        [ "$$(cli EXISTS shop:name)" = 1 ] || cli < /seed/redis.txt >/dev/null
        wait $$pid
    volumes: ["./seed/redis.txt:/seed/redis.txt:ro"]
    networks: [dev]
    healthcheck:   # answers once first-run seeding is done
      test: ["CMD-SHELL", "valkey-cli --user rowsmith --pass \"$$PW\" --no-auth-warning -n 1 EXISTS cache:stats | grep -q 1"]
      interval: 3s
      timeout: 5s
      retries: 100

  cockroach:
    image: cockroachdb/cockroach:latest-v26.3
    # Secure mode with generated certificates; rowsmith signs in with a
    # password over TLS, as on CockroachDB Cloud.
    command: start-single-node
    environment:
      COCKROACH_DATABASE: shop
      COCKROACH_USER: rowsmith
      COCKROACH_PASSWORD: ${DEV_DB_PASSWORD}
    volumes: ["./seed/pgwire.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro"]
    networks: [dev]
    healthcheck:   # answers once first-run seeding is done
      test: ["CMD-SHELL", "cd /cockroach && cockroach sql --url=\"$$(cat server.url)\" -e 'SELECT 1 FROM shop.reporting.targets LIMIT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 10s
      retries: 100

  yugabyte:
    image: yugabytedb/yugabyte:2026.1.2.0-b137
    environment:
      PW: ${DEV_DB_PASSWORD}
    # One node with password sign-in (yugabyte / $$PW), seeded once.
    command:
      - sh
      - -c
      - |
        bin/yugabyted start --advertise_address="$$(hostname)" --tserver_flags=ysql_enable_auth=true --background=true >/dev/null
        ysql() { PGPASSWORD="$$1" bin/ysqlsh -h "$$(hostname)" -U yugabyte -v ON_ERROR_STOP=1 -q "$${@:2}"; }
        until ysql "$$PW" -c 'SELECT 1' >/dev/null 2>&1 || ysql yugabyte -c 'SELECT 1' >/dev/null 2>&1; do sleep 1; done
        if ysql yugabyte -c 'SELECT 1' >/dev/null 2>&1; then
          ysql yugabyte -c 'CREATE DATABASE shop' && ysql yugabyte -d shop -f /seed/pgwire.sql && ysql yugabyte -c "ALTER ROLE yugabyte PASSWORD '$$PW'"
        fi
        exec tail -f /dev/null
    volumes: ["./seed/pgwire.sql:/seed/pgwire.sql:ro"]
    networks: [dev]
    healthcheck:   # answers once first-run seeding is done
      test: ["CMD-SHELL", "PGPASSWORD=\"$$PW\" bin/ysqlsh -h \"$$(hostname)\" -U yugabyte -d shop -c 'SELECT 1 FROM reporting.targets LIMIT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 100

  tidb:
    image: pingcap/tidb:v8.5.5
    networks: [dev]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:10080/status >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 100

  # TiDB has no init scripts: this seeds it once, sets root's password,
  # and reports healthy when the data is there.
  tidb-seed:
    image: mysql:8.4
    depends_on:
      tidb: { condition: service_healthy }
    environment:
      PW: ${DEV_DB_PASSWORD}
    entrypoint:
      - sh
      - -c
      - |
        if mysql -h tidb -P 4000 -uroot -e 'SELECT 1' >/dev/null 2>&1; then
          mysql -h tidb -P 4000 -uroot < /seed/tidb.sql && mysql -h tidb -P 4000 -uroot -e "ALTER USER 'root'@'%' IDENTIFIED BY '$$PW'"
        fi
        exec sleep infinity
    volumes: ["./seed/tidb.sql:/seed/tidb.sql:ro"]
    networks: [dev]
    healthcheck:
      test: ["CMD-SHELL", "mysql -h tidb -P 4000 -uroot -p\"$$PW\" -e 'SELECT 1 FROM shop.categories LIMIT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 200

  # Cassandra with password sign-in, materialized views and SAI indexes.
  cassandra:
    image: cassandra:5.0.9
    environment:
      MAX_HEAP_SIZE: 768M
      HEAP_NEWSIZE: 128M
      CASSANDRA_CLUSTER_NAME: rowsmith
      CASSANDRA_DC: dc1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    entrypoint:
      - sh
      - -c
      - |
        sed -i -e 's/^authenticator:.*/authenticator: PasswordAuthenticator/' -e 's/^authorizer:.*/authorizer: CassandraAuthorizer/' \
          -e 's/^materialized_views_enabled:.*/materialized_views_enabled: true/' /etc/cassandra/cassandra.yaml
        exec docker-entrypoint.sh cassandra -f
    networks: [dev]

  # Creates the rowsmith role and the shop keyspace once, then reports healthy.
  cassandra-seed:
    image: cassandra:5.0.9
    depends_on:
      cassandra: { condition: service_started }
    environment:
      PW: ${DEV_DB_PASSWORD}
    entrypoint:
      - sh
      - -c
      - |
        until cqlsh cassandra -u cassandra -p cassandra -e 'SELECT now() FROM system.local' >/dev/null 2>&1 || cqlsh cassandra -u rowsmith -p "$$PW" -e 'SELECT now() FROM system.local' >/dev/null 2>&1; do sleep 3; done
        cqlsh cassandra -u cassandra -p cassandra -e "CREATE ROLE IF NOT EXISTS rowsmith WITH PASSWORD = '$$PW' AND LOGIN = true AND SUPERUSER = true" 2>/dev/null
        q() { cqlsh cassandra -u rowsmith -p "$$PW" "$$@"; }
        if ! q -e 'DESCRIBE KEYSPACE shop' >/dev/null 2>&1; then
          q -e "CREATE KEYSPACE shop WITH replication = {'class': 'NetworkTopologyStrategy', 'dc1': 1}"
          q -f /seed/cassandra.cql
          q -e "CREATE INDEX customers_email ON shop.customers (email) USING 'sai'; CREATE INDEX customers_tier ON shop.customers (tier) USING 'sai'"
        fi
        touch /tmp/ready
        exec sleep infinity
    volumes: ["./seed/cassandra.cql:/seed/cassandra.cql:ro"]
    networks: [dev]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      timeout: 5s
      retries: 120

  # ScyllaDB in developer mode on one core, with password sign-in. It has
  # no default superuser: rowsmith is created at first start.
  scylla:
    image: scylladb/scylla:2026.3.2
    environment:
      PW: ${DEV_DB_PASSWORD}
    entrypoint:
      - sh
      - -c
      - |
        # In scylla.yaml, where the hash's $ signs are not expanded by a shell.
        sed -i '/^auth_superuser_/d' /etc/scylla/scylla.yaml
        printf "auth_superuser_name: rowsmith\nauth_superuser_salted_password: '%s'\n" "$$(openssl passwd -6 "$$PW")" >> /etc/scylla/scylla.yaml
        exec /docker-entrypoint.py --smp 1 --memory 1G --overprovisioned 1 --developer-mode 1 \
          --authenticator PasswordAuthenticator --authorizer CassandraAuthorizer
    networks: [dev]

  scylla-seed:
    image: scylladb/scylla:2026.3.2
    depends_on:
      scylla: { condition: service_started }
    environment:
      PW: ${DEV_DB_PASSWORD}
    entrypoint:
      - sh
      - -c
      - |
        q() { cqlsh scylla -u rowsmith -p "$$PW" "$$@"; }
        until cqlsh scylla -u rowsmith -p "$$PW" -e 'SELECT now() FROM system.local' >/dev/null 2>&1; do sleep 3; done
        if ! q -e 'DESCRIBE KEYSPACE shop' >/dev/null 2>&1; then
          # Materialized views need vnodes rather than tablets on some versions.
          q -e "CREATE KEYSPACE shop WITH replication = {'class': 'NetworkTopologyStrategy', 'datacenter1': 1} AND tablets = {'enabled': false}"
          q -f /seed/cassandra.cql
          q -e "CREATE INDEX customers_email ON shop.customers (email); CREATE INDEX customers_tier ON shop.customers (tier)"
        fi
        touch /tmp/ready
        exec sleep infinity
    volumes: ["./seed/cassandra.cql:/seed/cassandra.cql:ro"]
    networks: [dev]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      timeout: 5s
      retries: 120

  # Elasticsearch with password sign-in over plain HTTP.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      ELASTIC_PASSWORD: ${DEV_DB_PASSWORD}
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      xpack.ml.enabled: "false"
      cluster.routing.allocation.disk.threshold_enabled: "false"
    networks: [dev]

  elasticsearch-seed:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    depends_on:
      elasticsearch: { condition: service_started }
    environment:
      URL: http://elasticsearch:9200
      AUTH: elastic:${DEV_DB_PASSWORD}
    entrypoint: ["/seed/elastic-seed.sh"]
    volumes: ["./seed:/seed:ro"]
    networks: [dev]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      timeout: 5s
      retries: 120

  # OpenSearch with its demo certificates (HTTPS) and the admin user.
  opensearch:
    image: opensearchproject/opensearch:3.9.0
    environment:
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${DEV_DB_PASSWORD}Aa1!
      cluster.routing.allocation.disk.threshold_enabled: "false"
    networks: [dev]

  opensearch-seed:
    image: opensearchproject/opensearch:3.9.0
    depends_on:
      opensearch: { condition: service_started }
    environment:
      URL: https://opensearch:9200
      AUTH: admin:${DEV_DB_PASSWORD}Aa1!
      CURL_OPTS: -k
    entrypoint: ["/seed/elastic-seed.sh"]
    volumes: ["./seed:/seed:ro"]
    networks: [dev]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      timeout: 5s
      retries: 120

  # A small lake: SeaweedFS as S3, an Iceberg REST catalog, and Trino with
  # iceberg, delta, hive (plain Parquet/ORC/CSV files) and tpch catalogs.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    environment:
      PW: ${DEV_DB_PASSWORD}
    entrypoint:
      - sh
      - -c
      - |
        printf '{"identities":[{"name":"rowsmith","credentials":[{"accessKey":"rowsmith","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$PW" > /tmp/s3.json
        weed server -dir=/data -master.volumeSizeLimitMB=256 -s3 -s3.port=8333 -s3.config=/tmp/s3.json & pid=$$!
        trap 'kill $$pid; wait $$pid' TERM INT
        until echo "s3.bucket.list" | weed shell >/dev/null 2>&1; do sleep 1; done
        echo "s3.bucket.list" | weed shell 2>/dev/null | grep -q lake || echo "s3.bucket.create -name lake" | weed shell >/dev/null
        touch /tmp/ready
        wait $$pid
    networks: [dev]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 3s
      timeout: 5s
      retries: 100

  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1
    depends_on:
      seaweedfs: { condition: service_healthy }
    environment:
      CATALOG_WAREHOUSE: s3://lake/warehouse
      CATALOG_URI: jdbc:sqlite:file:/tmp/iceberg_catalog.db
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://seaweedfs:8333
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: rowsmith
      AWS_SECRET_ACCESS_KEY: ${DEV_DB_PASSWORD}
      AWS_REGION: us-east-1
    networks: [dev]

  trino:
    image: trinodb/trino:483
    depends_on:
      iceberg-rest: { condition: service_started }
    environment:
      LAKE_SECRET: ${DEV_DB_PASSWORD}
    volumes: ["./trino/catalog:/etc/trino/catalog:ro"]
    networks: [dev]
    healthcheck:
      test: ["CMD-SHELL", "trino --execute 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 60

  # Seeds the lake once (dev/seed/trino.sql) and reports healthy when done.
  trino-seed:
    image: trinodb/trino:483
    depends_on:
      trino: { condition: service_healthy }
    entrypoint:
      - sh
      - -c
      - |
        t() { trino --server http://trino:8080 --user rowsmith "$$@"; }
        if [ -z "$$(t --execute "SHOW SCHEMAS FROM iceberg LIKE 'shop'" 2>/dev/null)" ]; then
          t -f /seed/trino.sql
        fi
        if [ -z "$$(t --execute "SHOW SCHEMAS FROM delta LIKE 'sales'" 2>/dev/null)" ]; then
          t -f /seed/trino-delta.sql
        fi
        exec sleep infinity
    volumes: ["./seed/trino.sql:/seed/trino.sql:ro", "./seed/trino-delta.sql:/seed/trino-delta.sql:ro"]
    networks: [dev]
    healthcheck:
      test: ["CMD-SHELL", "trino --server http://trino:8080 --execute 'SELECT 1 FROM hive.raw.nations CROSS JOIN delta.sales.payments LIMIT 1' 2>/dev/null | grep -q 1"]
      interval: 5s
      timeout: 20s
      retries: 120

  bigquery:
    profiles: [full]
    image: ghcr.io/goccy/bigquery-emulator:latest
    command: ["--project=rowsmith-dev", "--dataset=analytics"]
    networks: [dev]
