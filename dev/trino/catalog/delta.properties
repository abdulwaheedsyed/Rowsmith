# Delta Lake tables in the lake bucket. The file metastore keeps tables under
# its own directory (s3://lake/deltalake/<schema>/<table>). Writes to S3 need
# non-concurrent mode, as there is no lock service.
connector.name=delta_lake
hive.metastore=file
hive.metastore.catalog.dir=s3://lake/deltalake
delta.enable-non-concurrent-writes=true
fs.native-s3.enabled=true
s3.endpoint=http://seaweedfs:8333
s3.path-style-access=true
s3.region=us-east-1
s3.aws-access-key=rowsmith
s3.aws-secret-key=${ENV:LAKE_SECRET}
