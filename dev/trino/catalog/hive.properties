# Plain files (Parquet, ORC, CSV) in the lake bucket, as external tables.
# The metastore is a directory in the bucket: no Hive server needed.
connector.name=hive
hive.metastore=file
hive.metastore.catalog.dir=s3://lake/hive
hive.non-managed-table-writes-enabled=true
fs.native-s3.enabled=true
s3.endpoint=http://seaweedfs:8333
s3.path-style-access=true
s3.region=us-east-1
s3.aws-access-key=rowsmith
s3.aws-secret-key=${ENV:LAKE_SECRET}
