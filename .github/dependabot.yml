# Weekly update pull requests. Minor and patch updates come grouped into one
# pull request per ecosystem; major updates arrive one at a time, so each can
# be tested on its own. Security updates are separate and arrive as soon as an
# advisory is published (turn them on under Settings → Code security).
# Versions wait 14 days after their release before they're offered.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      go:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      web:
        update-types: [minor, patch]

  # Base images in the Dockerfile and the SSH bastion used by the tests
  - package-ecosystem: docker
    directories: [/, /dev/bastion]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    ignore:
      # Node 25 is a short-lived release, already out of support: the base
      # image moves from one long-term release to the next.
      - dependency-name: node
        versions: [">= 25, < 26"]
    groups:
      images:
        update-types: [minor, patch]

  # Test databases: keep them on the release lines the drivers are tested against
  - package-ecosystem: docker-compose
    directory: /dev
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      test-databases:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
